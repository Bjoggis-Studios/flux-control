apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: authorization-server
  namespace: flux-system
spec:
  image: bjoggis/authorization-server
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: authorization-server
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: authorization-server
  policy:
    semver:
      range: v0.x
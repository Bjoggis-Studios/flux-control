apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: patchmon
  namespace: flux-system
spec:
  interval: 1m
  path: ./infrastructure/patchmon
  prune: true
  retryInterval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  serviceAccountName: kustomize-controller
  timeout: 3m
  wait: true

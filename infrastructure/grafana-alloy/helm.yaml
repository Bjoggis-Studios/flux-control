apiVersion: v1
kind: Namespace
metadata:
  name: grafana-alloy
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana-helm-chart
  namespace: grafana-alloy
spec:
  interval: 1m
  url: https://grafana.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-alloy
  namespace: grafana-alloy
spec:
  chart:
    spec:
      chart: alloy
      sourceRef:
        kind: HelmRepository
        name: grafana-helm-chart
        namespace: grafana-alloy
  interval: 1m
  values:
    alloy:
      configMap:
        content: |-
          // Write your Alloy config here:
          logging {
            level = "info"
            format = "logfmt"
          }
          otelcol.receiver.otlp "otlp_receiver" {
            grpc {
              endpoint = "0.0.0.0:4317"
            }

            http {
              endpoint = "0.0.0.0:4318"
            }

            output {
              traces  = [otelcol.exporter.otlp.tempo]
            }
          }
          
          otelcol.exporter.otlp "tempo" {
            client {
              endpoint = "tempo:4317"
              tls {
                insecure = true
              }
            }
          }
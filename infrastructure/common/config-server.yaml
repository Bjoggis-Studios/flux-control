apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: common
spec:
  selector:
    matchLabels:
      app: config-server
  replicas: 1
  template:
    metadata:
      labels:
        app: config-server
    spec:
      serviceAccountName: config-server
      containers:
        - name: config-server
          image: bjoggis/config-server:v14-x86_64
          ports:
            - containerPort: 8888
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: loki.url
              value: 'http://five.tailscale.svc.cluster.local:3100/loki/api/v1/push'
            - name: ENCRYPT_KEY
              valueFrom:
                secretKeyRef:
                  name: config-server-secrets
                  key: encrypt-key
            - name: SPRING_CLOUD_CONFIG_JDBC_URL
              valueFrom:
                secretKeyRef:
                  name: config-server-secrets
                  key: jdbc-url
            - name: SPRING_CLOUD_CONFIG_JDBC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: config-server-secrets
                  key: jdbc-username
            - name: SPRING_CLOUD_CONFIG_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: config-server-secrets
                  key: jdbc-password
---
apiVersion: v1
kind: Service
metadata:
  name: config-server-service
  namespace: common
spec:
  selector:
    app: config-server
  type: ClusterIP
  ports:
    - port: 8888
      targetPort: 8888

apiVersion: v1
kind: ServiceAccount
metadata:
  name: config-server
  namespace: common
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: config-secret-manager
  namespace: common
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: config-secret-manager-binding
  namespace: common
subjects:
  - kind: ServiceAccount
    name: config-server
    namespace: common
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: config-secret-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: config-secret-manager
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: config-secret-manager-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: config-server
    namespace: common
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: config-secret-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: config-secret-admin
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: config-secret-admin-binding
subjects:
  - kind: ServiceAccount
    name: config-server
    namespace: common
roleRef:
  kind: ClusterRole
  name: config-secret-admin
  apiGroup: rbac.authorization.k8s.io
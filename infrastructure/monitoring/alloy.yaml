apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  interval: 1m
  timeout: 3m
  chart:
    spec:
      chart: alloy
      version: 1.0.3
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
      interval: 1m
  values:
    alloy:
      configMap:
        content: |
          // OTLP receiver configuration
          // Fans out each signal to its own backend in the LGTM stack.
          otelcol.receiver.otlp "otlp_receiver" {
            grpc {
              endpoint = "0.0.0.0:4317"
            }
            http {
              endpoint = "0.0.0.0:4318"
            }
            output {
              traces  = [otelcol.exporter.otlp.tempo.input]
              metrics = [otelcol.exporter.prometheus.to_prom.input]
              logs    = [otelcol.exporter.loki.to_loki.input]
            }
          }

          // ---------- TRACES -> Tempo ----------
          otelcol.exporter.otlp "tempo" {
            client {
              endpoint = "tempo:4317"
              tls {
                insecure = true
              }
            }
          }

          // ---------- METRICS -> Prometheus ----------
          // Convert OTLP metrics into Prometheus samples...
          otelcol.exporter.prometheus "to_prom" {
            forward_to = [prometheus.remote_write.prom.receiver]
          }

          // ...then remote-write them to the kube-prometheus-stack Prometheus
          // (enableRemoteWriteReceiver is already turned on for it).
          prometheus.remote_write "prom" {
            endpoint {
              url = "http://kube-prometheus-stack-prometheus:9090/api/v1/write"
            }
          }

          // ---------- LOGS -> Loki ----------
          // Convert OTLP logs into the Loki format...
          otelcol.exporter.loki "to_loki" {
            forward_to = [loki.write.loki.receiver]
          }

          // ...then push them to the in-cluster Loki gateway.
          loki.write "loki" {
            endpoint {
              url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
            }
          }

      # Extra ports to expose OTLP receivers
      extraPorts:
        - name: otlp-grpc
          port: 4317
          targetPort: 4317
          protocol: TCP
        - name: otlp-http
          port: 4318
          targetPort: 4318
          protocol: TCP
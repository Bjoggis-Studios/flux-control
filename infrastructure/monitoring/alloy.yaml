apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  interval: 1m
  timeout: 3m
  chart:
    spec:
      chart: alloy
      version: 1.0.3
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
      interval: 1m
  values:
    alloy:
      configMap:
        content: |
          // OTLP receiver configuration
          otelcol.receiver.otlp "otlp_receiver" {
            grpc {
              endpoint = "0.0.0.0:4317"
            }
            http {
              endpoint = "0.0.0.0:4318"
            }
            output {
              traces = [otelcol.exporter.otlp.tempo.input]
            }
          }

          // OTLP exporter to Tempo
          otelcol.exporter.otlp "tempo" {
            client {
              endpoint = "tempo:4317"
              tls {
                insecure = true
              }
            }
          }

      # Extra ports to expose OTLP receivers
      extraPorts:
        - name: otlp-grpc
          port: 4317
          targetPort: 4317
          protocol: TCP
        - name: otlp-http
          port: 4318
          targetPort: 4318
          protocol: TCP
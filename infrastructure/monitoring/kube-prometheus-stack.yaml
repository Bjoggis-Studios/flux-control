apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1m
  timeout: 3m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 72.6.2
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 1m
  values:
    prometheus:
      prometheusSpec:
        # Enable remote write receiver for Tempo metrics (default: false)
        enableRemoteWriteReceiver: true
        # Enable exemplar storage for metrics-traces linking (default: [])
        enableFeatures:
          - exemplar-storage
          - native-histograms

    grafana:
      persistence:
        enabled: true
        size: 5Gi
        storageClassName: "nfs-csi"
      # Enable anonymous access for demo (default: requires login)
      grafana.ini:
        auth.anonymous:
          enabled: false
          org_role: Admin
        auth:
          disable_login_form: false
        feature_toggles:
          enable: traceqlEditor

        # Add trace exploration plugin (default: no plugins)
      plugins:
        - grafana-exploretraces-app

        # Connect Grafana to Tempo (default: only Prometheus datasource)
      datasources:
        datasources.yaml:
          apiVersion: 1
          datasources:
            - name: Tempo
              type: tempo
              access: proxy
              url: http://tempo:3200
              uid: tempo
              jsonData:
                httpMethod: GET
                serviceMap:
                  datasourceUid: prometheus
                tracesToMetrics:
                  datasourceUid: prometheus
                # Jump from a trace's span to its logs in Loki
                tracesToLogsV2:
                  datasourceUid: loki

            # Connect Grafana to the in-cluster Loki (default: no logs datasource)
            - name: Loki
              type: loki
              access: proxy
              url: http://loki-gateway.monitoring.svc.cluster.local
              uid: loki
              jsonData:
                # Jump from a log line back to its trace in Tempo
                derivedFields:
                  - name: TraceID
                    matcherRegex: '"trace_id":"(\w+)"'
                    url: '$${__value.raw}'
                    datasourceUid: tempo

    # Disable components for simpler demo setup
    alertmanager:
      enabled: false  # Default: true

    nodeExporter:
      enabled: false  # Default: true

    prometheus-node-exporter:
      enabled: false  # Default: true
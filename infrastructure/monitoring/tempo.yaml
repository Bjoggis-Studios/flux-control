apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: monitoring
spec:
  interval: 1m
  timeout: 3m
  chart:
    spec:
      chart: tempo
      version: 2.2.3
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: monitoring
      interval: 1m
  values:
    tempo:
      metricsGenerator:
        enabled: true
        remoteWriteUrl: "http://kube-prometheus-stack-prometheus:9090/api/v1/write"

      # Enable service graphs and span metrics
      overrides:
        defaults:
          metrics_generator:
            processors: [ service-graphs, span-metrics, local-blocks ]

    # Enable persistence for realistic setup
    persistence:
      enabled: true
      existingClaim: tempo-nfs-pvc

      storage:
        trace:
          backend: local
          local:
            path: /var/tempo/traces
          wal:
            path: /var/tempo/wal

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: tempo-nfs-pv
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  nfs:
    server: qnas.tailscale.svc.cluster.local # Replace with your NAS IP
    path: /prod/talos/monitoring/tempo  # Replace with your NAS share path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tempo-nfs-pvc
  namespace: tempo
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: "" # Leave empty for static PV binding
  resources:
    requests:
      storage: 100Gi
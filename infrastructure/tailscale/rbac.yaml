apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: config-secret-manager
  namespace: tailscale
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: config-secret-manager-binding
  namespace: tailscale
subjects:
  - kind: ServiceAccount
    name: config-server
    namespace: common
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: config-secret-manager
